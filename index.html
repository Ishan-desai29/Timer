<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-MINUS · Split-Flap Countdown</title>
  <meta name="theme-color" content="#0b0d0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-accent="doom">
  <!-- Wallpaper layers -->
  <div id="wallpaper" class="wallpaper"></div>
  <div class="wallpaper-dim" id="wallpaperDim"></div>
  <div class="vignette"></div>
  <canvas id="grain" class="grain"></canvas>
  <div class="scanlines"></div>
  <div class="flash" id="flash"></div>

  <main class="stage" id="stage">
    <section class="housing" id="housing">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>

      <header class="housing-top">
        <div class="dymo" id="label" contenteditable="true" spellcheck="false" title="Click to rename">DOOMSDAY</div>
        <div class="lamps">
          <div class="lamp-wrap"><span class="lamp" id="lampArmed"></span><small>ARMED</small></div>
          <div class="lamp-wrap"><span class="lamp" id="lampRun"></span><small>RUN</small></div>
          <div class="lamp-wrap"><span class="lamp danger" id="lampCrit"></span><small>CRIT</small></div>
        </div>
      </header>

      <div class="display-well">
        <div class="display" id="display"><!-- built by JS --></div>
      </div>

      <div class="plate-row">
        <span class="plate">MODEL TM-1997</span>
        <span class="plate serial" id="statusText">STANDBY</span>
        <span class="plate">SER. 00-0451-D</span>
      </div>
    </section>

    <section class="console">
      <div class="console-group">
        <button class="key primary" id="btnStart" title="Start / Pause (Space)"><span>START</span></button>
        <button class="key" id="btnReset" title="Reset (R)"><span>RESET</span></button>
      </div>

      <div class="console-group presets" id="presets">
        <button class="key small" data-preset="60">1 MIN</button>
        <button class="key small" data-preset="300">5 MIN</button>
        <button class="key small" data-preset="1500">25 MIN</button>
        <button class="key small" data-preset="3600">1 HR</button>
      </div>

      <div class="console-group">
        <button class="key small icon" id="btnMute" title="Mute (M)">SND</button>
        <button class="key small icon" id="btnFull" title="Fullscreen (F)">FULL</button>
        <button class="key small icon" id="btnSettings" title="Settings (S)">SETUP</button>
      </div>
    </section>

    <p class="hint" id="hint">Use ▲ ▼ or scroll on a column to set the time<span class="keys"> · <kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>F</kbd> fullscreen</span></p>
  </main>

  <!-- Settings drawer -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-inner">
      <header class="drawer-head">
        <h2>Setup</h2>
        <button class="key small" id="btnCloseSettings">CLOSE</button>
      </header>

      <fieldset>
        <legend>Mode</legend>
        <div class="seg" id="modeSeg">
          <button data-mode="timer" class="on">Timer</button>
          <button data-mode="date">Countdown to date</button>
        </div>
        <label class="row" id="dateRow" hidden>
          <span>Target</span>
          <input type="datetime-local" id="targetDate" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Wallpaper</legend>
        <div class="swatches" id="swatches"></div>
        <div class="row gap">
          <label class="key small file-btn">UPLOAD IMAGE
            <input type="file" id="wallFile" accept="image/*" hidden />
          </label>
          <input type="url" id="wallUrl" placeholder="…or paste an image URL" />
        </div>
        <label class="row"><span>Darken</span><input type="range" id="wallDim" min="0" max="90" value="45" /></label>
        <label class="row"><span>Blur</span><input type="range" id="wallBlur" min="0" max="20" value="0" /></label>
      </fieldset>

      <fieldset>
        <legend>Glow</legend>
        <div class="seg" id="accentSeg">
          <button data-accent="doom" class="on">Doom green</button>
          <button data-accent="amber">Amber</button>
          <button data-accent="blood">Blood red</button>
          <button data-accent="ice">Ice</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Sound</legend>
        <label class="row"><span>Master</span><input type="range" id="volMaster" min="0" max="100" value="80" /></label>
        <label class="row"><span>Flap clack</span><input type="range" id="volClick" min="0" max="100" value="85" /></label>
        <label class="row"><span>Dread drone</span><input type="range" id="volDrone" min="0" max="100" value="45" /></label>
        <label class="row check"><input type="checkbox" id="optMinuteBoom" checked /> <span>Deep boom every minute</span></label>
        <label class="row check"><input type="checkbox" id="optHeartbeat" checked /> <span>Heartbeat in the final 10 seconds</span></label>
        <div class="row gap">
          <label class="key small file-btn">CUSTOM CLACK SOUND
            <input type="file" id="tickFile" accept="audio/*" hidden />
          </label>
          <button class="key small" id="tickClear">USE BUILT-IN</button>
        </div>
        <p class="note" id="tickNote">Using the built-in synthesized flap.</p>
      </fieldset>

      <fieldset>
        <legend>Display</legend>
        <label class="row check"><input type="checkbox" id="optShake" checked /> <span>Shake &amp; flash at zero</span></label>
        <label class="row check"><input type="checkbox" id="optCrt" checked /> <span>CRT scanlines &amp; film grain</span></label>
      </fieldset>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
