<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timer</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Flip Timer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="wall-dim" id="wallDim"></div>

  <main class="app">
    <div class="col-main">
      <header class="nav"><h1>Timer</h1></header>

      <section class="face">
        <!-- Idle: scroll wheels -->
        <div class="picker" id="picker">
          <div class="picker-band"></div>
          <div class="wheel" data-unit="h" data-max="23" data-label="hours"></div>
          <div class="wheel" data-unit="m" data-max="59" data-label="min"></div>
          <div class="wheel" data-unit="s" data-max="59" data-label="sec"></div>
        </div>

        <!-- Running / paused: flip cards inside the ring -->
        <div class="dial" id="dial" hidden>
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="96" />
            <circle class="prog" id="ringProg" cx="100" cy="100" r="96" />
          </svg>
          <div class="dial-inner">
            <div class="dial-label" id="dialLabel"></div>
            <div class="display" id="display"></div>
            <div class="dial-end" id="dialEnd">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
              <span id="endTime"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="controls">
        <button class="round cancel" id="btnCancel" disabled><span>Cancel</span></button>
        <button class="round start" id="btnStart"><span>Start</span></button>
      </section>
    </div>

    <div class="col-side">
      <section class="group">
        <label class="cell">
          <span>Label</span>
          <input type="text" id="label" placeholder="Timer" maxlength="28" autocomplete="off" enterkeyhint="done" />
        </label>
        <label class="cell">
          <span>When Timer Ends</span>
          <select id="endSound">
            <option value="rattle">Flap Rattle</option>
            <option value="once">Single Rattle</option>
            <option value="silent">Silent</option>
          </select>
        </label>
      </section>

      <h2 class="group-title">Sound</h2>
      <section class="group">
        <div class="cell slider-cell">
          <span>Click Volume</span>
          <div class="slider-row">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
            <input type="range" id="volClick" min="0" max="100" value="85" aria-label="Click volume" />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="cell slider-cell">
          <span>Echo</span>
          <div class="slider-row">
            <input type="range" id="echo" min="0" max="100" value="55" aria-label="Echo" />
          </div>
        </div>
        <label class="cell" id="silentRow" hidden>
          <span>Play When Silent Mode Is On</span>
          <input type="checkbox" class="switch" id="optSilent" />
        </label>
        <label class="cell tappable">
          <span>Custom Click Sound</span>
          <span class="value" id="tickNote">Built-in</span>
          <input type="file" id="tickFile" accept="audio/*" hidden />
        </label>
        <button class="cell link" id="tickClear" hidden>Use Built-in Click</button>
      </section>

      <h2 class="group-title">Recents</h2>
      <section class="group" id="recents"></section>

      <h2 class="group-title">Wallpaper</h2>
      <section class="group">
        <div class="cell swatch-cell"><div class="swatches" id="swatches"></div></div>
        <label class="cell tappable">
          <span class="blue">Choose Photo…</span>
          <input type="file" id="wallFile" accept="image/*" hidden />
        </label>
        <div class="cell slider-cell">
          <span>Dim</span>
          <div class="slider-row"><input type="range" id="wallDimRange" min="0" max="90" value="0" aria-label="Dim wallpaper" /></div>
        </div>
        <div class="cell slider-cell">
          <span>Blur</span>
          <div class="slider-row"><input type="range" id="wallBlur" min="0" max="30" value="0" aria-label="Blur wallpaper" /></div>
        </div>
      </section>

      <p class="foot">Space to start or pause · Esc to cancel</p>
    </div>
  </main>

  <!-- Timer done -->
  <div class="alert" id="alert" hidden>
    <div class="alert-card" role="alertdialog" aria-labelledby="alertBig">
      <div class="alert-title" id="alertTitle">Timer</div>
      <div class="alert-big" id="alertBig">Timer Done</div>
      <div class="alert-actions">
        <button id="alertStop" class="stop">Stop</button>
        <button id="alertRepeat">Repeat</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
